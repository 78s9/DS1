server:
  port: 8080

spring:
  profiles:
    active: dev

# ===== JWT (all profiles) =====
jwt:
  secret: DS1-SECRET-KEY-2026-MUST-BE-AT-LEAST-256-BITS-LONG-FOR-HS256
  expiration: 86400000  # 24 hours

---
# ===== dev profile (H2) =====
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:ds1db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

---
# ===== prod profile (MySQL) =====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3306/ds1db?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
